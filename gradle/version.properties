# App 发布版本号 —— 与依赖版本**分开**维护，所以它不在 gradle/libs.versions.toml 里。
#
# 为什么单独一份：
#   * 发版号是「产品身份」，依赖版本是「构建配方」。两者变更节奏、审阅人、失败后果都不同，
#     混在一个文件里会让「这次发版号动了吗」变得需要翻 diff 才能回答。
#   * 冻结基线按它判定身份（docs/refactor/artifact-manifest.json 的
#     t03Freeze.packageIdentity；tools/verification.ps1 的 Test-Bd2ReleaseSmoke 硬断言
#     versionCode=17 / versionName=0.2.16）。放独立文件也让这条约束一眼可见。
#
# 格式：Java .properties（UTF-8、无 BOM），键名大小写敏感。
#   appVersionName —— 字符串，非空、非纯空白
#   appVersionCode —— 正整数（>= 1），十进制、无前导零以外的修饰
#
# 发布流程约定（**不是**机器校验，见 docs/refactor/evidence/T11.md §3.6/§8）：
#   每次对外发版，appVersionCode 必须比上一次对外发布的版本**严格递增**。
#   单次构建无从得知「上一次的值」，所以没有可靠办法在配置阶段判定；
#   这条靠发版前人工核对与评审把关。
#
# 校验（由 app/build.gradle.kts 在**配置阶段**执行，任一条不满足即非零退出）：
#   * 文件缺失 / 键缺失 / appVersionName 为空或纯空白 / appVersionCode 非整数或 <= 0
#   * APP_VERSION_NAME 环境变量非空时覆盖 appVersionName；覆盖后仍须通过同样的非空校验
appVersionName=0.3.1
appVersionCode=19

# 项目级 Gradle 配置。这份会进公开仓库，所以只放对所有人都成立的设置。
#
# 本机专属的东西（代理、SDK 路径、buildPython）一律不写在这里：
#   代理      → ~/.gradle/gradle.properties
#   SDK 路径  → local.properties（已在 .gitignore 中）
#   Python    → local.properties 的 chaquopy.python，见 app/build.gradle.kts
# 早先这里硬编码了一个本机代理地址，别人克隆下来会卡在依赖下载上。

android.useAndroidX=true

# 原先这一项写了两遍（4g 后又跟一行 3g，后者生效），实际只用上 3g。
# 合成一行并取 4g —— Chaquopy 打包 + Compose 编译在 3g 下偶尔会吃紧。
org.gradle.jvmargs=-Xmx4g
